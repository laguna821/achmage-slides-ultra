name: Governance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production and full dependency graphs
        run: |
          npm audit --omit=dev
          npm audit

      - name: Run the release quality suite
        run: npm run acceptance:all

      - name: Run type-aware Obsidian lint
        run: npm run lint

      - name: Run local Scorecard preflight
        run: npm run scorecard:preflight

      - name: Verify the committed deployment artifact
        run: |
          npm run build
          git diff --exit-code -- main.js

  research-traceability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.x"

      - name: Validate research, plans, executions, and changed paths
        env:
          GOVERNANCE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          GOVERNANCE_REQUIRE_COMPLETE_EXECUTION: "true"
        run: node scripts/governance.mjs check

      - name: Exercise governance failure gates
        run: node scripts/governance-smoke.mjs
