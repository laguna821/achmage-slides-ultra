name: Governance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  research-traceability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Validate research, plans, executions, and changed paths
        env:
          GOVERNANCE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          GOVERNANCE_REQUIRE_COMPLETE_EXECUTION: "true"
        run: node scripts/governance.mjs check

      - name: Exercise governance failure gates
        run: node scripts/governance-smoke.mjs
